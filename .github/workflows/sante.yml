name: Santé des données
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sante:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Contrôles (cohérence, fraîcheur, sources)
        id: controles
        run: |
          : > sante.md
          for s in check-data check-fraicheur check-sources; do
            if ! node "scripts/$s.js" > "$s.out" 2> "$s.err"; then
              { echo "### $s"; echo; cat "$s.out" "$s.err" | head -60 | sed 's/^/    /'; echo; } >> sante.md
            fi
          done
          if [ -s sante.md ]; then echo "probleme=1" >> "$GITHUB_OUTPUT"; else echo "Tout est sain."; fi
      # Pas de ticket ni d'e-mail : le problème est écrit dans le résumé de l'exécution (onglet Actions)
      - name: Écrire le résumé
        if: steps.controles.outputs.probleme == '1'
        run: |
          { echo "Le contrôle hebdomadaire de santé du $(date -u +%Y-%m-%d) signale un problème."; echo; cat sante.md; } >> "$GITHUB_STEP_SUMMARY"
