name: Statistiques Instagram
on:
  schedule:
    # Deux relevés par jour : tard le soir (J+0 des stories du jour) et tôt le matin (stories d'hier encore dans leurs 24 h)
    - cron: "37 20 * * *"
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Sans les secrets IG_USER_ID et IG_ACCESS_TOKEN : sortie propre (voir docs/STATS.md). Lecture seule côté Instagram.
      - name: Relever les statistiques
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: https://graph.instagram.com/v21.0
        run: node scripts/stats-instagram.cjs
      - name: Recommandations (suggestions, aucun réglage modifié)
        run: node scripts/recommandations.cjs
      - name: Contrôler les données
        run: node scripts/check-data.js
      - name: Committer les statistiques
        run: scripts/commit-push.sh "Statistiques Instagram ($(date -u +%Y-%m-%d\ %H:%M) UTC)" data/instagram-stats.json docs/stats
