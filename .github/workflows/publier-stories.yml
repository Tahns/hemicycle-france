name: Publier les stories
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  # Après chaque relevé d'actualités : la story sort sans attendre le quart d'heure suivant
  workflow_run:
    workflows: ["Actualités"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Sans les secrets IG_USER_ID et IG_ACCESS_TOKEN : sortie propre (voir docs/PUBLICATION-AUTO.md). Aucun e-mail, aucune issue.
      - name: Publier la prochaine story sur Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publier-stories.cjs
      - name: Committer le registre des publications
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-publiees.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Stories publiées ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            # Plusieurs workflows écrivent dans data/ : on reprend le dernier état distant et on réessaie
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            git status -sb | head -1
          fi
