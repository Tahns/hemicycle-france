name: Publier les stories
on:
  # Un passage toutes les 5 minutes (minimum de GitHub) de 4 h à 22 h UTC ; le script ne publie qu'entre 7 h et 23 h à Paris, été comme hiver : les contenus à créneau (« Aujourd'hui à l'Assemblée » vers 8 h 30,
  # « vote du jour » vers 12 h 30, « chiffre du jour » vers 19 h, carrousel du dimanche vers 18 h 30) sortent au plus tard 5 à 10 min après leur heure
  schedule:
    - cron: "*/5 4-22 * * *"
  # Après chaque relevé d'actualités : la story sort sans attendre le quart d'heure suivant
  workflow_run:
    workflows: ["Actualités", "Contenus récurrents"]
    types: [completed]
  workflow_dispatch:
    inputs:
      a_sec:
        description: "À sec : tout vérifier, rien publier"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      # Repartir de l'état le plus récent de la branche (et non du SHA de l'événement) : un passage resté en file pendant qu'un autre publiait
      # repartirait sinon avec l'ANCIEN registre et republierait l'entrée déjà sortie.
      - name: Se placer sur l'état le plus récent de la branche
        run: |
          git fetch --depth=50 origin "${GITHUB_REF_NAME:-main}"
          git reset --hard "origin/${GITHUB_REF_NAME:-main}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Sans les secrets IG_USER_ID et IG_ACCESS_TOKEN : sortie propre (voir docs/PUBLICATION-AUTO.md). Aucun e-mail, aucune issue.
      - name: Publier la prochaine story sur Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_BASE: https://graph.instagram.com/v21.0
        run: node scripts/publier-stories.cjs ${{ inputs.a_sec && '--a-sec' || '' }}
      - name: Committer le registre des publications
        if: always()
        run: scripts/commit-push.sh "Stories publiées ($(date -u +%Y-%m-%d\ %H:%M) UTC)" data/instagram-publiees.json
      # Si le push du registre a échoué (la publication, elle, a eu lieu) : nouvel essai après une pause ; le job reste en ÉCHEC visible dans tous les cas où le registre n'est pas poussé
      - name: Nouvel essai du push du registre
        if: failure()
        run: |
          sleep 30
          git fetch origin "${GITHUB_REF_NAME:-main}"
          scripts/commit-push.sh "Stories publiées, registre (reprise $(date -u +%Y-%m-%d\ %H:%M) UTC)" data/instagram-publiees.json
