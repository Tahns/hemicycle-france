name: Mise à jour automatique des données
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Mémoire des requêtes conditionnelles (ETag / Last-Modified) : évite de retélécharger les grosses archives inchangées
      - name: Mémoire HTTP (validateurs des sources)
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      # Chaque source est indépendante : l'échec de l'une n'empêche pas la publication des autres.
      - name: Scrutins, dossiers et groupes (Assemblée nationale)
        id: scrutins
        run: node scripts/fetch-scrutins.js
        continue-on-error: true
      - name: Indicateurs (Insee, accès public sans clé)
        id: insee
        run: node scripts/fetch-insee.js
        continue-on-error: true
      - name: Budget de l'État et de la Sécurité sociale (Eurostat, comptes des administrations publiques)
        id: budget
        run: node scripts/fetch-budget.js
        continue-on-error: true
      - name: Sondages (liste Wikipédia, notices de la Commission des sondages)
        id: sondages
        run: node scripts/fetch-sondages.js
        continue-on-error: true
      - name: Probabilités (qualification au second tour, victoire) calculées depuis les sondages
        id: probabilites
        run: node scripts/probabilites.js
        continue-on-error: true

      - name: Veille des sondages (notices de la Commission des sondages)
        id: veille
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@4
          node scripts/veille-sondages.js
        continue-on-error: true

      - name: Communes et circonscriptions (reconstruit tous les 90 jours)
        id: communes
        run: node scripts/fetch-communes.js
        continue-on-error: true
      - name: Présidentielle 2022 par commune (construit une seule fois, résultats définitifs)
        id: elections
        run: node scripts/fetch-elections.js
        continue-on-error: true
      - name: Scrutins publics du Sénat
        id: senat
        run: node scripts/fetch-senat.js
        continue-on-error: true
      - name: Sénateurs en fonction et leur vote sur chaque texte
        id: senateurs
        run: node scripts/fetch-senateurs.js
        continue-on-error: true
      - name: Ordre du jour des séances de l'Assemblée
        id: agenda
        run: node scripts/fetch-agenda-an.js
        continue-on-error: true
      - name: Vérifications des faits (flux publics des rédactions ; un flux injoignable est signalé sans bloquer)
        id: verifications
        run: node scripts/fetch-verifications.js
        continue-on-error: true
      - name: Bandeau « En direct » (d'après les actualités et l'agenda déjà relevés)
        id: direct
        run: node scripts/detecter-direct.js
        continue-on-error: true
      - name: Parcours des textes entre l'Assemblée et le Sénat
        id: navette
        run: node scripts/navette.js
        continue-on-error: true
      - name: Activité des députés (questions, amendements) et déclarations HATVP (chaque semaine)
        id: activite
        run: node scripts/fetch-activite.js
        continue-on-error: true
      - name: Rencontres avec des représentants d'intérêts (répertoire HATVP)
        id: lobbying
        run: node scripts/fetch-lobbying.js
        continue-on-error: true
      - name: Chefs de parti (infobox Wikipédia de chaque parti)
        id: dirigeants
        run: node scripts/fetch-dirigeants.js
        continue-on-error: true
      - name: Logos des partis (Wikimedia Commons, seulement s'ils changent)
        id: logos
        run: node scripts/fetch-logos.js
        continue-on-error: true
      - name: Portraits libres des personnalités sans photo officielle (Wikimedia Commons)
        id: portraits
        run: node scripts/fetch-portraits.js
        continue-on-error: true
      - name: Candidats déclarés à la présidentielle (Wikipédia)
        id: candidats
        run: node scripts/fetch-candidats.js
        continue-on-error: true

      # Comptes des visiteurs : met la CSP d'index.html en accord avec data/compte-config.json (sans fichier : CSP inchangée)
      - name: Comptes (adresse Supabase autorisée dans la CSP)
        id: compte
        run: node scripts/appliquer-compte.js
        continue-on-error: true

      - name: Contrôler la cohérence des données avant publication
        run: node scripts/check-data.js
      # Pages d'aperçu pour le partage (v/ votes clés, d/ députés) : titres et images tirés du site lui-même
      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Générer les pages et images d'aperçu
        id: partage
        run: node scripts/partage.cjs
        continue-on-error: true

      # Vidéos animées (stories vidéo, Reels) : seulement si "videos": true dans data/stories-config.json ; sans ffmpeg, l'image part seule
      - name: Installer ffmpeg (vidéos animées)
        run: |
          if grep -q '"videos": *true' data/stories-config.json; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
        continue-on-error: true

      - name: Story automatique (file d'attente Instagram, sans publication)
        id: story
        run: node scripts/stories-auto.cjs
        continue-on-error: true

      - name: Photos des députés et des sénateurs (seulement les nouvelles)
        id: photos
        run: node scripts/photos.cjs
        continue-on-error: true
      - name: Photos HD des parlementaires cités dans l'actualité (stories nettes)
        id: photoshd
        run: node scripts/photos-hd.cjs
        continue-on-error: true

      # Seulement s'il y a du nouveau (les fichiers dont seul l'horodatage changerait ne sont pas réécrits, voir garde.js) ;
      # échec du push = échec visible de l'exécution (scripts/commit-push.sh)
      - name: Committer les changements s'il y en a
        run: scripts/commit-push.sh "Mise à jour automatique des données ($(date -u +%Y-%m-%d))" data/ instagram/auto instagram/file.atom v/ d/ s/ p/ photos/ icons/partage.jpg icons/partis/ sitemap.xml robots.txt feed.xml index.html

      - name: Vérifier la fraîcheur des données
        id: fraicheur
        run: node scripts/check-fraicheur.js 2> fraicheur.txt
        continue-on-error: true

      - name: Vérifier les sources citées avec le Décodex
        id: sources
        run: node scripts/check-sources.js 2> sources.txt
        continue-on-error: true

      # Alerte : écrite dans le résumé de l'exécution (onglet Actions), sans ticket ni e-mail
      - name: Signaler un problème dans le résumé de l'exécution
        if: always() && (failure() || steps.scrutins.outcome == 'failure' || steps.insee.outcome == 'failure' || steps.budget.outcome == 'failure' || steps.sondages.outcome == 'failure' || steps.compte.outcome == 'failure' || steps.probabilites.outcome == 'failure' || steps.veille.outcome == 'failure' || steps.candidats.outcome == 'failure' || steps.dirigeants.outcome == 'failure' || steps.activite.outcome == 'failure' || steps.lobbying.outcome == 'failure' || steps.elections.outcome == 'failure' || steps.navette.outcome == 'failure' || steps.senat.outcome == 'failure' || steps.communes.outcome == 'failure' || steps.verifications.outcome == 'failure' || steps.fraicheur.outcome == 'failure' || steps.sources.outcome == 'failure' || steps.partage.outcome == 'failure' || steps.senateurs.outcome == 'failure' || steps.agenda.outcome == 'failure' || steps.photos.outcome == 'failure' || steps.logos.outcome == 'failure' || steps.direct.outcome == 'failure' || steps.story.outcome == 'failure' || steps.photoshd.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "La mise à jour automatique du $(date -u +%Y-%m-%d) signale un problème."
            echo
            [ "${{ steps.verifications.outcome }}" = "failure" ] && echo "- **Vérifications** : le nouveau fichier a été refusé (chute des titres ou format de flux changé ; fichier précédent conservé)."
            [ "${{ steps.scrutins.outcome }}" = "failure" ] && echo "- **Scrutins** : échec du script (les votes ne sont plus mis à jour)."
            [ "${{ steps.insee.outcome }}" = "failure" ] && echo "- **Insee** : au moins un indicateur n'a pas pu être mis à jour (valeur précédente conservée)."
            [ "${{ steps.budget.outcome }}" = "failure" ] && echo "- **Budget** : données d'Eurostat illisibles, incomplètes ou incohérentes (fichier précédent conservé, la rubrique garde les derniers chiffres)."
            [ "${{ steps.partage.outcome }}" = "failure" ] && echo "- **Partage** : les pages d'aperçu des nouveaux votes n'ont pas pu être générées (le lien partagé renvoie alors vers le vote sans image d'aperçu)."
            [ "${{ steps.communes.outcome }}" = "failure" ] && echo "- **Communes** : la table communes → circonscriptions n'a pas pu être reconstruite (la recherche par commune garde l'ancienne)."
            [ "${{ steps.senat.outcome }}" = "failure" ] && echo "- **Sénat** : lecture des scrutins impossible ou nombreux scrutins écartés (format des pages changé ?)."
            [ "${{ steps.activite.outcome }}" = "failure" ] && echo "- **Activité des députés** : archives de l'Assemblée ou liste HATVP illisibles (données précédentes conservées)."
            [ "${{ steps.lobbying.outcome }}" = "failure" ] && echo "- **Représentants d'intérêts** : répertoire HATVP illisible (données précédentes conservées)."
            [ "${{ steps.elections.outcome }}" = "failure" ] && echo "- **Présidentielle 2022 par commune** : fichiers du ministère introuvables ou incohérents sur data.gouv.fr."
            [ "${{ steps.senateurs.outcome }}" = "failure" ] && echo "- **Sénateurs** : liste officielle illisible ou votes nom par nom qui ne correspondent pas aux totaux officiels."
            [ "${{ steps.agenda.outcome }}" = "failure" ] && echo "- **Ordre du jour de l'Assemblée** : agenda open data illisible (ancien agenda conservé)."
            [ "${{ steps.logos.outcome }}" = "failure" ] && echo "- **Logos des partis** : fichier introuvable ou licence non libre sur Wikimedia Commons (vérifier data/logos.json)."
            [ "${{ steps.photos.outcome }}" = "failure" ] && echo "- **Photos des élus** : nombreuses photos impossibles à télécharger."
            [ "${{ steps.navette.outcome }}" = "failure" ] && echo "- **Parcours des textes** : correspondance Assemblée/Sénat impossible à construire."
            [ "${{ steps.dirigeants.outcome }}" = "failure" ] && echo "- **Chefs de parti** : au moins une infobox Wikipédia n'a pas pu être lue (entrée conservée)."
            [ "${{ steps.candidats.outcome }}" = "failure" ] && echo "- **Candidats 2027** : lecture de la page Wikipédia des candidatures impossible ou trop de lignes illisibles."
            [ "${{ steps.veille.outcome }}" = "failure" ] && echo "- **Veille des sondages** : liste ou notices de la Commission des sondages illisibles."
            [ "${{ steps.probabilites.outcome }}" = "failure" ] && echo "- **Probabilités** : calcul impossible à partir des sondages (anciennes probabilités conservées)."
            [ "${{ steps.compte.outcome }}" = "failure" ] && echo "- **Comptes** : data/compte-config.json invalide (l'URL doit être https://<projet>.supabase.co) ; la CSP n'a pas été modifiée, les comptes restent cachés."
            [ "${{ steps.sondages.outcome }}" = "failure" ] && echo "- **Sondages** : lecture de la liste Wikipédia impossible ou enquêtes écartées par les contrôles."
            [ "${{ steps.direct.outcome }}" = "failure" ] && echo "- **Bandeau En direct** : détection impossible (ancien bandeau conservé)."
            [ "${{ steps.story.outcome }}" = "failure" ] && echo "- **Story automatique** : génération de l'image impossible (rien ajouté à la file)."
            [ "${{ steps.photoshd.outcome }}" = "failure" ] && echo "- **Photos HD** : téléchargement impossible (les stories utilisent la vignette)."
            [ -s fraicheur.txt ] && cat fraicheur.txt
            [ -s sources.txt ] && cat sources.txt
            echo
            echo "Journal complet : $RUN_URL"
          } > alerte.md
          # Aucun ticket ni e-mail : le problème est lu dans le résumé de l'exécution (onglet Actions)
          cat alerte.md >> "$GITHUB_STEP_SUMMARY"
