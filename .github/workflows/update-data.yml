name: Mise à jour automatique des données
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Récupérer les nouveaux scrutins de l'Assemblée nationale
        run: node scripts/fetch-scrutins.js
      - name: Récupérer les indicateurs INSEE
        run: node scripts/fetch-insee.js
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        continue-on-error: true
      - name: Contrôler la cohérence des données avant publication
        run: node scripts/check-data.js
      - name: Committer les changements s'il y en a
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données — rien à committer."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
