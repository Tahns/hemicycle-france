name: Vérifications
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntaxe des scripts
        run: for f in scripts/*.js scripts/*.cjs; do node --check "$f"; done
      # Tous les fichiers tests/*.test.mjs et tests/*.test.js sont lancés (un nouveau test est pris en compte sans modifier ce fichier)
      - name: Tests unitaires
        run: node tests/lancer-tous.mjs
      - name: Cohérence des données
        run: node scripts/check-data.js --strict
      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test du site dans un vrai navigateur (ordinateur et mobile)
        run: node tests/smoke.cjs
      - name: Navigation fluide (nœuds DOM, tâches longues, CPU ralenti)
        run: node tests/perf-navigation.cjs --cpu=6
