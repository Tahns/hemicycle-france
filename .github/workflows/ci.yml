name: Vérifications
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntaxe des scripts
        run: for f in scripts/*.js; do node --check "$f"; done
      - name: Tests du garde-fou et des licences
        run: node tests/garde.test.mjs && node tests/detecter-direct.test.mjs && node tests/compte.test.mjs && node tests/verifications.test.mjs
      - name: Cohérence des données
        run: node scripts/check-data.js
      - name: Installer Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test du site dans un vrai navigateur (ordinateur et mobile)
        run: node tests/smoke.cjs
      - name: Navigation fluide (nœuds DOM, tâches longues, CPU ralenti)
        run: node tests/perf-navigation.cjs --cpu=6
