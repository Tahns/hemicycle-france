name: Actualités
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  # GitHub retarde souvent les tâches programmées : relevé aussi après chaque mise à jour des données,
  # et dès qu'une modification du relevé ou des illustrations est fusionnée
  workflow_run:
    workflows: ["Mise à jour automatique des données"]
    types: [completed]
  push:
    branches: [main]
    paths: ["scripts/fetch-actualites.js", "scripts/illustrations.js", "data/portraits.json", "data/sondages.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  actualites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Déclenché par la fin d'une mise à jour : seulement si elle a réussi (pas de relance après un échec ou une annulation)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Mémoire HTTP (relevés récents)
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      # Sur un déclenchement workflow_run, les flux ne sont pas redemandés si le dernier relevé date de moins de 10 minutes
      - name: Titres de la rubrique politique des médias (flux RSS)
        env:
          GATE_MINUTES: ${{ github.event_name == 'workflow_run' && '10' || '' }}
        run: node scripts/fetch-actualites.js
      - name: Bandeau « En direct » (prise de parole du président, séance de l'Assemblée)
        run: node scripts/detecter-direct.js
        continue-on-error: true
      # File de stories Instagram : au plus un sujet par exécution, image dessinée par le site lui-même.
      # Rien n'est publié ici (aucune clé, aucun appel à Instagram) : la file et les JPEG sont seulement committés.
      - name: Un sujet mérite-t-il une story ?
        id: story_choix
        run: node scripts/stories-auto.cjs --a-faire >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Installer Playwright (Chromium)
        if: steps.story_choix.outputs.a_faire == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
        continue-on-error: true
      # Vidéos animées (stories vidéo, Reels) : seulement si "videos": true dans data/stories-config.json ; sans ffmpeg, l'image part seule
      - name: Installer ffmpeg (vidéos animées)
        if: steps.story_choix.outputs.a_faire == 'true'
        run: |
          if grep -Eq '"videos"[[:space:]]*:[[:space:]]*true' data/stories-config.json; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
        continue-on-error: true
      # Stories nettes : versions haute définition des portraits des personnes citées (Commons : mêmes licences et crédits ;
      # photos officielles du Parlement : seulement les parlementaires cités). Sans elles, la story utilise la vignette, réduite.
      - name: Portraits HD des personnalités (Wikimedia Commons)
        if: steps.story_choix.outputs.a_faire == 'true'
        run: node scripts/fetch-portraits.js --max=0
        continue-on-error: true
      - name: Photos HD des parlementaires cités dans l'actualité
        if: steps.story_choix.outputs.a_faire == 'true'
        run: node scripts/photos-hd.cjs
        continue-on-error: true
      - name: Story automatique (file d'attente Instagram)
        if: steps.story_choix.outputs.a_faire == 'true'
        run: node scripts/stories-auto.cjs
        continue-on-error: true
      - name: Contrôler la cohérence des données
        run: node scripts/check-data.js
      - name: Committer s'il y a du nouveau
        run: scripts/commit-push.sh "Actualités ($(date -u +%Y-%m-%d\ %H:%M) UTC)" data/actualites.json data/direct.json data/instagram-file.json data/portraits.json data/portraits-couverture.json photos/personnalites/medaillons instagram/auto instagram/file.atom photos/personnalites/hd photos/deputes/hd photos/senateurs/hd instagram/brouillons
      # Alerte : écrite dans le résumé de l'exécution (onglet Actions), sans ticket ni e-mail
      - name: Signaler un problème dans le résumé de l'exécution
        if: failure()
        run: |
          {
            echo "Le relevé d'actualités du $(date -u +%Y-%m-%d\ %H:%M) UTC a échoué : aucune donnée n'a été committée par cette exécution."
            echo "Journal complet : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
