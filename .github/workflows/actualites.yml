name: Actualités
on:
  schedule:
    - cron: "37 * * * *"
  # GitHub retarde souvent les tâches programmées : relevé aussi après chaque mise à jour des données,
  # et dès qu'une modification du relevé ou des illustrations est fusionnée
  workflow_run:
    workflows: ["Mise à jour automatique des données"]
    types: [completed]
  push:
    branches: [main]
    paths: ["scripts/fetch-actualites.js", "scripts/illustrations.js", "data/portraits.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  actualites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Titres de la rubrique politique des médias (flux RSS)
        run: node scripts/fetch-actualites.js
      - name: Bandeau « En direct » (prise de parole du président, séance de l'Assemblée)
        run: node scripts/detecter-direct.js
        continue-on-error: true
      - name: Contrôler la cohérence des données
        run: node scripts/check-data.js
      - name: Committer s'il y a du nouveau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actualites.json data/direct.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Actualités ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            # Plusieurs workflows écrivent dans data/ : on reprend le dernier état distant et on réessaie
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            git status -sb | head -1
          fi
